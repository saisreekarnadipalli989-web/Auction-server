services:
  postgres:
    image: postgres:16-alpine
    container_name: bidflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bidflow
    ports:
      - "5432:5432"
    volumes:
      - bidflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bidflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bidflow_pg_data:
    driver: local
